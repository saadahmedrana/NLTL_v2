[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nltl-shacl-pipeline"
version = "0.2.0"
description = "Vocabulary-grounded NL-to-SHACL generation and separate RDF evaluation"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "python-dotenv>=1,<2",
  "rdflib>=7.6,<8",
  "pyshacl>=0.31,<0.32",
]

[project.scripts]
nltl-pipeline = "nltl_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
