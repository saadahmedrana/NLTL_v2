[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "nltlv2-refined"
version = "0.11.3"
description = "General source-grounded NLTL; independent offline evaluation"
requires-python = ">=3.11"
dependencies = ["rdflib==7.6.0", "pyshacl==0.31.0", "owlrl==7.6.2", "requests==2.32.5", "python-dotenv==1.2.2", "tiktoken==0.12.0", "regex==2025.11.3"]
[project.scripts]
nltl = "nltlv2.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
