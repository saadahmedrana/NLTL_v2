[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "nltlv2-refined"
version = "0.1.0"
description = "Isolated, evidence-bound NLTL refinement; offline development verification"
requires-python = ">=3.11"
dependencies = ["rdflib==7.6.0", "pyshacl==0.31.0", "requests==2.32.5", "python-dotenv==1.2.2"]
[project.scripts]
nltl = "nltlv2.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
